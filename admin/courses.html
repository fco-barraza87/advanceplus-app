        <!-- Barra superior -->
    <header class="admin-header">
      <div class="admin-header-left">
        <div class="brand-mark">
          <div class="brand-logo">A+</div>
          <div class="brand-text">
            <span class="brand-title">Advance+</span>
            <span class="brand-subtitle">Panel Admin · Usuarios</span>
          </div>
        </div>
      </div>
            <!-- Navegación superior -->
      <nav class="admin-nav">
        <a href="/admin/index.html" class="nav-link">Dashboard</a>
        <a href="/admin/users.html" class="nav-link nav-link--active">Usuarios</a>
        <a href="/admin/courses.html" class="nav-link">Cursos</a>
        <a href="/admin/lessons.html" class="nav-link">Lecciones</a>
        <a href="/admin/progress.html" class="nav-link">Progreso</a>
        <a href="/admin/marketing.html" class="nav-link">Marketing</a>
        <a href="/admin/settings.html" class="nav-link">Settings</a>
      </nav>

      <div class="admin-header-right">
        <div id="current-role-pill" class="role-pill role-pill--unknown">Cargando...</div>
        <div class="admin-logout-wrapper">
          <button id="admin-logout-btn" class="btn btn-ghost small">
            Cerrar sesión
          </button>
        </div>

      </div>
    </header> 

  <main class="admin-layout">
    <section class="admin-page-header"></section>

    <section class="admin-content">
      <div class="admin-panel">
        <div class="admin-panel-header">
          <h2>Cursos</h2>
          <button id="btnNewCourse" class="btn-primary">+ Nuevo curso</button>
        </div>

        <div class="admin-panel-body">
          <table class="admin-table" id="coursesTable">
            <thead>
              <tr>
                <th>Título</th>
                <th>Slug</th>
                <th>Categoría</th>
                <th>Días</th>
                <th>Activo</th>
              </tr>
            </thead>
            <tbody id="coursesTableBody">
              <!-- filas dinámicas -->
            </tbody>
          </table>
        </div>
      </div>

      <div class="admin-panel">
        <div class="admin-panel-header">
          <h2 id="courseFormTitle">Editar curso</h2>
        </div>
        <div class="admin-panel-body">
          <form id="courseForm" class="admin-form">
            <input type="hidden" id="courseId" />

            <label>
              Título
              <input type="text" id="courseTitle" required />
            </label>

            <label>
              Slug
              <input type="text" id="courseSlug" required />
            </label>

            <label>
              Subtítulo
              <input type="text" id="courseSubtitle" />
            </label>

            <label>
              Descripción
              <textarea id="courseDescription" rows="3" required></textarea>
            </label>

            <label>
              Categoría
              <input type="text" id="courseCategory" required />
            </label>

            <label>
              Duración (días)
              <input type="number" id="courseDurationDays" min="1" required />
            </label>

            <label>
              Nivel
              <input type="text" id="courseLevel" required />
            </label>

            <label>
              URL portada (cover_url)
              <input type="text" id="courseCoverUrl" required />
            </label>

            <label>
              Precio
              <input type="number" step="0.01" id="coursePrice" />
            </label>

            <label>
              Moneda
              <input type="text" id="courseCurrency" value="CHF" />
            </label>

            <label>
              XP recompensa (xp_reward)
              <input type="number" id="courseXpReward" />
            </label>

            <label>
              Tipo de progresión (progression_type)
              <input type="text" id="courseProgressionType" value="daily" />
            </label>

            <label>
              Tags (separados por coma)
              <input type="text" id="courseTags" placeholder="enfoque,mentalidad" />
            </label>

            <label class="checkbox-inline">
              <input type="checkbox" id="courseActive" checked />
              Activo
            </label>

            <label>
              Visibilidad
              <select id="courseVisibility">
                <option value="public">public</option>
                <option value="private">private</option>
                <option value="hidden">hidden</option>
              </select>
            </label>

            <div class="admin-form-actions">
              <button type="submit" class="btn-primary">Guardar</button>
              <button type="button" id="btnResetCourseForm" class="btn-secondary">Limpiar</button>
            </div>
          </form>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="/admin/courses.js"></script>
</body>
</html>
