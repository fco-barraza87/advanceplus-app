<!-- /admin/courses.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Admin · Cursos | Advance+</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/admin/css/index.css" />
</head>
<body>
  <div class="admin-shell">

    <!-- HEADER ADMIN PREMIUM -->
    <div id="admin-header"></div>
    <script type="module" src="/admin/components/header.js"></script>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="admin-main">

      <!-- Hero / título de página -->
      <section class="hero-section">
        <div>
          <h1 class="hero-title">Panel Admin · Cursos</h1>
          <p class="hero-subtitle">Ver, crear y editar cursos.</p>
        </div>
      </section>

      <!-- PANEL PRINCIPAL -->
      <section class="admin-content">

        <!-- Lista de cursos -->
        <div class="admin-panel">
          <div class="admin-panel-header">
            <h2>Cursos</h2>
            <button id="btnNewCourse" class="btn-primary">+ Nuevo curso</button>
          </div>

          <div class="admin-panel-body">
            <table class="admin-table" id="coursesTable">
              <thead>
                <tr>
                  <th>Título</th>
                  <th>Slug</th>
                  <th>Categoría</th>
                  <th>Días</th>
                  <th>Activo</th>
                </tr>
              </thead>
              <tbody id="coursesTableBody">
                <!-- filas dinámicas -->
              </tbody>
            </table>
          </div>
        </div>

        <!-- Editor de curso -->
        <div class="admin-panel">
          <div class="admin-panel-header">
            <h2 id="courseFormTitle">Editar curso</h2>
          </div>

          <div class="admin-panel-body">
            <form id="courseForm" class="admin-form">
              <input type="hidden" id="courseId" />

              <label>Título
                <input type="text" id="courseTitle" required />
              </label>

              <label>Slug
                <input type="text" id="courseSlug" required />
              </label>

              <label>Subtítulo
                <input type="text" id="courseSubtitle" />
              </label>

              <label>Descripción
                <textarea id="courseDescription" rows="3" required></textarea>
              </label>

              <label>Categoría
                <input type="text" id="courseCategory" required />
              </label>

              <label>Duración (días)
                <input type="number" id="courseDurationDays" min="1" required />
              </label>

              <label>Nivel
                <input type="text" id="courseLevel" required />
              </label>

              <label>URL portada (cover_url)
                <input type="text" id="courseCoverUrl" required />
              </label>

              <label>Precio
                <input type="number" step="0.01" id="coursePrice" />
              </label>

              <label>Moneda
                <input type="text" id="courseCurrency" value="CHF" />
              </label>

              <label>XP recompensa
                <input type="number" id="courseXpReward" />
              </label>

              <label>Progresión
                <input type="text" id="courseProgressionType" value="daily" />
              </label>

              <label>Tags
                <input type="text" id="courseTags" placeholder="enfoque,mentalidad" />
              </label>

              <label class="checkbox-inline">
                <input type="checkbox" id="courseActive" checked />
                Activo
              </label>

              <label>Visibilidad
                <select id="courseVisibility">
                  <option value="public">public</option>
                  <option value="private">private</option>
                  <option value="hidden">hidden</option>
                </select>
              </label>

              <div class="admin-form-actions">
                <button type="submit" class="btn-primary">Guardar</button>
                <button type="button" id="btnResetCourseForm" class="btn-secondary">Limpiar</button>
              </div>
            </form>
          </div>
        </div>

      </section>
    </main>
  </div>

  <script type="module" src="/admin/courses.js"></script>
</body>
