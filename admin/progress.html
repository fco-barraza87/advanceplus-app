<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Admin · Progreso | Advance+</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>

<body class="app-bg">

  <!-- HEADER -->
  <div id="appHeader"></div>
  <script type="module">
    import { loadHeader } from "/components/header.js";
    loadHeader();
  </script>

  <main class="admin-layout">

    <section class="admin-page-header"></section>

    <!-- ================================
         THREE-COLUMN LAYOUT
    ================================= -->
    <section class="admin-columns-3">

      <!-- 1) USUARIOS -->
      <div class="admin-panel col-users">
        <div class="admin-panel-header">
          <h2>Usuarios</h2>
        </div>

        <input 
          id="searchUser" 
          type="text" 
          placeholder="Buscar usuario por nombre, email o ID..."
          class="admin-search-input"
        />

        <table class="admin-table" id="usersTable">
          <thead>
            <tr>
              <th>Avatar</th>
              <th>Nombre</th>
              <th>Email</th>
              <th>XP</th>
              <th>Nivel</th>
              <th>ID</th>
            </tr>
          </thead>
          <tbody id="usersTableBody">
            <!-- Dinámico -->
          </tbody>
        </table>
      </div>

      <!-- 2) CURSOS DEL USUARIO -->
      <div class="admin-panel col-courses">
        <div class="admin-panel-header">
          <h2>Cursos del Usuario</h2>
          <button id="btnAddCourse" class="btn-primary">+ Agregar Curso</button>
        </div>

        <table class="admin-table" id="userCoursesTable">
          <thead>
            <tr>
              <th>Curso</th>
              <th>Progreso</th>
              <th>XP</th>
              <th>Status</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="userCoursesTableBody">
            <!-- Dinámico -->
          </tbody>
        </table>

      </div>

      <!-- 3) PROGRESO POR DÍA -->
      <div class="admin-panel col-progress">
        <div class="admin-panel-header">
          <h2 id="progressTitle">Progreso del Curso</h2>
        </div>

        <table class="admin-table" id="progressTable">
          <thead>
            <tr>
              <th>Día</th>
              <th>Título</th>
              <th>Completado</th>
              <th>XP</th>
              <th>Fecha</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="progressTableBody">
            <!-- Dinámico -->
          </tbody>
        </table>

      </div>

    </section>

  </main>

  <script type="module" src="/admin/progress.js"></script>

</body>
</html>
