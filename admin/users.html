<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Advance+ Admin · Usuarios</title>

  <link rel="stylesheet" href="/admin/css/admin-base.css" />
  <link rel="stylesheet" href="/admin/css/dashboard.css" />
  <link rel="stylesheet" href="/admin/css/users.css" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>

<body class="admin-body">

  <!-- SIDEBAR -->
  <aside class="admin-sidebar">
    <div class="sidebar-logo">
      <span class="sidebar-logo-icon">A+</span>
      <span class="sidebar-logo-text">Advance+</span>
    </div>

    <nav class="sidebar-nav">
      <a href="/admin/index.html" class="sidebar-link">Dashboard</a>
      <a href="/admin/users.html" class="sidebar-link active">Usuarios</a>
      <a href="/admin/courses.html" class="sidebar-link">Cursos</a>
      <a href="/admin/lessons.html" class="sidebar-link">Lecciones</a>
      <a href="/admin/progress.html" class="sidebar-link">Progreso</a>
      <a href="/admin/marketing.html" class="sidebar-link">Marketing</a>
      <a href="/admin/settings.html" class="sidebar-link">Configuración</a>
    </nav>
  </aside>

  <!-- MAIN -->
  <div class="admin-main">

    <!-- ============================================================
         HEADER FIJO (también integrado aquí)
    ============================================================ -->
    <header class="admin-header-bar">
      <div class="admin-header-left">
        <button id="sidebarToggle" class="admin-burger-btn">☰</button>
      </div>

      <div class="admin-header-right">
        
        <!-- Nombre + rol -->
        <div class="admin-user-info">
          <span id="adminUserName" class="admin-user-name">Cargando...</span>
          <span id="adminUserRole" class="admin-user-role">—</span>
        </div>

        <!-- Avatar -->
        <div class="admin-avatar-wrapper">
          <div id="adminAvatar" class="admin-avatar">A</div>

          <!-- Menú -->
          <div id="adminMenu" class="admin-menu hidden">
            <a href="/dashboard/index.html">Modo usuario</a>
            <a href="/admin/settings.html">Configuración</a>
            <button id="adminLogoutBtnMenu">Cerrar sesión</button>
          </div>
        </div>

      </div>
    </header>

    <!-- CONTENIDO -->
    <main class="admin-content">

      <h1 class="page-title">Usuarios</h1>
      <p class="page-subtitle">Administración de roles, actividad y estado de cada usuario.</p>

      <!-- FILTROS -->
      <section class="users-filters">
        <input id="searchInput" class="input-text" placeholder="Buscar por nombre o email..." />

        <select id="roleFilter" class="input-select">
          <option value="">Todos los roles</option>
          <option value="admin">Admins</option>
          <option value="coach">Coaches</option>
          <option value="user">Usuarios</option>
        </select>

        <select id="statusFilter" class="input-select">
          <option value="">Todos los estados</option>
          <option value="completed">Onboarding completado</option>
          <option value="pending">Onboarding pendiente</option>
        </select>
      </section>

      <!-- TABLA -->
      <section class="users-table-wrapper">
        <table class="users-table">
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Email</th>
              <th>Rol</th>
              <th>Onboarding</th>
              <th>Creado</th>
              <th></th>
            </tr>
          </thead>

          <tbody id="usersTableBody">
            <!-- Render dinámico -->
          </tbody>
        </table>
      </section>

    </main>
  </div>

  <script type="module" src="/admin/js/admin-users.js"></script>

</body>
</html>
