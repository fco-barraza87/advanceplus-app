<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <title>Advance+ Admin — Lecciones</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Tipografías -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- CSS base admin + página lecciones -->
  <link rel="stylesheet" href="/admin/css/admin-base.css" />
  <link rel="stylesheet" href="/admin/css/admin-lessons.css" />
</head>

<body class="admin-body">

  <!-- SIDEBAR FIJO -->
  <aside class="admin-sidebar">
    <div class="sidebar-logo">
      <span class="sidebar-logo-icon">A+</span>
      <span class="sidebar-logo-text">Advance+</span>
    </div>

    <nav class="sidebar-nav">
      <a href="/admin/index.html" class="sidebar-link">Dashboard</a>
      <a href="/admin/users.html" class="sidebar-link">Usuarios</a>
      <a href="/admin/courses.html" class="sidebar-link">Cursos</a>
      <a href="/admin/lessons.html" class="sidebar-link active">Lecciones</a>
      <a href="/admin/progress.html" class="sidebar-link">Progreso</a>
      <a href="/admin/marketing.html" class="sidebar-link">Marketing</a>
      <a href="/admin/settings.html" class="sidebar-link">Configuración</a>
    </nav>
  </aside>

  <!-- ÁREA PRINCIPAL -->
  <div class="admin-main">

    <!-- HEADER SUPERIOR -->
    <header class="admin-header-bar">
      <div class="admin-header-left">
        <button id="sidebarToggle" class="admin-burger-btn">☰</button>
        <span class="admin-header-title">Lecciones</span>
      </div>

      <div class="admin-header-right">
        <span id="adminUserLabel" class="admin-user-label">Admin</span>
        <button id="adminLogoutBtn" class="admin-logout-btn">Cerrar sesión</button>
      </div>
    </header>

    <!-- CONTENIDO -->
    <main class="admin-content">

      <!-- Hero -->
      <section class="admin-hero">
        <div>
          <h1 class="admin-hero-title">Lecciones</h1>
          <p class="admin-hero-subtitle">
            Administración completa de todas las lecciones de tus cursos.
          </p>
        </div>
        <div class="admin-hero-actions">
          <button id="btnNewLesson" class="btn-primary">
            + Nueva lección
          </button>
        </div>
      </section>

      <!-- Filtros -->
      <section class="filters-section">
        <div class="filters-row">
          <div class="filter-item filter-grow">
            <label for="searchInput">Buscar</label>
            <input
              id="searchInput"
              type="text"
              placeholder="Buscar por título o subtítulo..."
            />
          </div>

          <div class="filter-item">
            <label for="courseFilter">Curso</label>
            <select id="courseFilter">
              <option value="">Todos los cursos</option>
              <!-- Opciones dinámicas -->
            </select>
          </div>

          <div class="filter-item">
            <label for="checkpointFilter">Checkpoint</label>
            <select id="checkpointFilter">
              <option value="">Todos</option>
              <option value="1">Solo checkpoints</option>
              <option value="0">Solo lecciones normales</option>
            </select>
          </div>

          <div class="filter-item">
            <label for="tagFilter">Tag</label>
            <input
              id="tagFilter"
              type="text"
              placeholder="Filtrar por tag..."
            />
          </div>
        </div>
      </section>

      <!-- Tabla de lecciones -->
      <section class="table-section">
        <div class="table-wrapper">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Curso</th>
                <th>Día</th>
                <th>Título</th>
                <th>Duración</th>
                <th>XP</th>
                <th>Tags</th>
                <th>Checkpoint</th>
                <th>Actualizado</th>
                <th>Orden</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="lessonsTableBody">
              <!-- filas dinámicas -->
            </tbody>
          </table>
        </div>
      </section>

    </main>
  </div>

  <!-- JS -->
  <script type="module" src="/js/supabase.js"></script>
  <script type="module" src="/admin/js/admin-auth.js"></script>
  <script type="module" src="/admin/js/admin-lessons.js"></script>

</body>
</html>
