<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión · Advance+</title>

  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>

<body class="app-bg">

  <main class="auth-container">

    <div class="auth-card">

      <div class="auth-header">
        <h1 class="auth-logo">A+</h1>
        <h2>Bienvenido de vuelta</h2>
        <p>Inicia sesión para continuar tu entrenamiento</p>
      </div>

      <form id="loginForm" class="auth-form">

        <div class="auth-field">
          <label>Email</label>
          <input type="email" id="email" class="input" placeholder="tu@email.com" required>
        </div>

        <div class="auth-field">
          <label>Contraseña</label>
          <input type="password" id="password" class="input" placeholder="********" required>
        </div>

        <button class="btn btn-primary auth-btn" type="submit">Entrar</button>

        <p class="auth-switch">
          ¿No tienes cuenta?
          <a href="/auth/register.html">Crear una</a>
        </p>

      </form>

    </div>

  </main>

  <script type="module">
    import { supabase } from "/js/supabase.js";
    import { redirectByRole } from "/js/router.js";

    const form = document.getElementById("loginForm");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      const { error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        alert("Error al iniciar sesión: " + error.message);
        return;
      }

      redirectByRole();
    });
  </script>

</body>
</html>
