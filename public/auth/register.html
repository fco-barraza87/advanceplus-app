<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crear cuenta · Advance+</title>

  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>

<body class="app-bg">

  <main class="auth-container">

    <div class="auth-card">

      <div class="auth-header">
        <h1 class="auth-logo">A+</h1>
        <h2>Crea tu cuenta</h2>
        <p>Comienza tu entrenamiento hoy</p>
      </div>

      <form id="registerForm" class="auth-form">

        <div class="auth-field">
          <label>Nombre completo</label>
          <input type="text" id="name" class="input" placeholder="Tu nombre" required>
        </div>

        <div class="auth-field">
          <label>Email</label>
          <input type="email" id="email" class="input" placeholder="correo@email.com" required>
        </div>

        <div class="auth-field">
          <label>Contraseña</label>
          <input type="password" id="password" class="input" placeholder="********" required>
        </div>

        <button class="btn btn-primary auth-btn" type="submit">Crear cuenta</button>

        <p class="auth-switch">
          ¿Ya tienes una cuenta?
          <a href="/auth/login.html">Iniciar sesión</a>
        </p>

      </form>

    </div>

  </main>

  <script type="module">
    import { supabase } from "/js/supabase.js";

    const form = document.getElementById("registerForm");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      // Crear usuario
      const { data, error } = await supabase.auth.signUp({
        email,
        password,
      });

      if (error) {
        alert("Error al crear cuenta: " + error.message);
        return;
      }

      // Crear perfil en tabla public.profiles
      const userId = data?.user?.id;

      if (userId) {
        await supabase.from("profiles").insert({
          id: userId,
          full_name: name,
          email,
          role: "user"
        });
      }

      alert("Cuenta creada. Revisa tu correo si es necesario confirmar.");
      window.location.href = "/auth/login.html";
    });
  </script>

</body>
</html>
