<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lección · Advance+</title>

  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/courses.css">
</head>

<body class="app-bg dashboard-page">

  <!-- HEADER -->
  <div id="appHeader"></div>

  <main class="dashboard-main">
    <div class="dashboard-wrapper">

      <!-- =========================
           HEADER LECCIÓN
      ========================== -->
      <section class="dash-section lesson-header-section">
        <button id="lessonBackBtn" class="btn-outline">← Volver</button>

        <p id="lessonCourseLabel" class="lesson-course-label"></p>
        <h1 id="lessonTitle" class="lesson-title">Cargando lección…</h1>
        <p id="lessonSubtitle" class="lesson-subtitle"></p>
        <p id="lessonMeta" class="lesson-meta"></p>
      </section>

      <!-- =========================
           🟡 MICRO-CHEQUEO PASADO
           (desaparece al responder)
      ========================== -->
      <section
        id="missionCheckinCard"
        class="dash-section coach-checkin hidden"
        data-type="checkin"
      >
        <h3>Chequeo rápido</h3>
        <p>Ayer te comprometiste con una acción. ¿Cómo te fue?</p>

        <div class="coach-checkin-actions">
          <button data-result="done" class="btn-outline">✅ La hice</button>
          <button data-result="partial" class="btn-outline">⚠️ Parcial</button>
          <button data-result="skipped" class="btn-outline">❌ No la hice</button>
        </div>

        <input
          id="missionCheckinNote"
          placeholder="¿Qué fue lo más difícil? (opcional)"
        />

        <button id="missionCheckinSkip" class="btn-link">
          Omitir hoy
        </button>
      </section>

      <!-- =========================
           📘 CONTENIDO LECCIÓN
      ========================== -->
      <section class="dash-section lesson-content-section">
        <div id="lessonContent" class="lesson-content"></div>
        <div id="lessonMedia" class="lesson-media"></div>
      </section>

      <!-- =========================
           ✍️ EJERCICIO
      ========================== -->
      <section class="dash-section lesson-exercise-section">
        <h2>Ejercicio del día</h2>
        <p id="lessonExerciseText"></p>

        <textarea
          id="lessonReflectionInput"
          rows="6"
          placeholder="Escribe aquí tu reflexión o compromiso…"
        ></textarea>

        <small>Se guarda automáticamente</small>
      </section>

      <!-- =========================
           ⭐ FEEDBACK
      ========================== -->
      <section class="dash-section lesson-feedback-section">
        <h2>Tu feedback</h2>

        <div id="feedbackStars" class="feedback-stars"></div>

        <textarea
          id="feedbackComment"
          rows="4"
          placeholder="¿Qué fue lo más valioso hoy? (opcional)"
        ></textarea>
      </section>

      <!-- =========================
           ✅ COMPLETAR LECCIÓN
      ========================== -->
      <section class="dash-section lesson-complete-section">
        <button id="completeLessonBtn" class="btn btn-primary">
          Marcar lección como completada
        </button>
      </section>

      <!-- =========================
           🔵 COACH-CARD IA
           (SOLO aparece al final)
      ========================== -->
      <section
        id="coachCard"
        class="dash-section coach-card hidden"
        data-type="coach"
      >
        <h3>Mensaje de tu Coach</h3>

        <div id="coachCardContent"></div>

        <button id="coachCardContinueBtn" class="btn btn-primary">
          Continuar
        </button>
      </section>

      <!-- =========================
           🟣 CHAT COACH (ON-DEMAND)
      ========================== -->
      <section class="dash-section coach-chat-section">
        <button id="openCoachChatBtn" class="btn-outline">
          💬 Hablar con mi Coach
        </button>

        <div id="coachChat" class="coach-chat hidden">
          <div id="coachChatMessages" class="coach-chat-messages"></div>

          <div class="coach-chat-input">
            <input id="coachChatInput" placeholder="Escribe tu mensaje…" />
            <button id="coachChatSend" class="btn btn-primary">Enviar</button>
          </div>
        </div>
      </section>

      <!-- =========================
           ⬅️ ➡️ NAVEGACIÓN
      ========================== -->
      <section class="dash-section lesson-navigation-section">
        <button id="prevLessonBtn" class="nav-btn">← Anterior</button>
        <button id="nextLessonBtn" class="nav-btn">Siguiente →</button>
      </section>

    </div>
  </main>

  <!-- =========================
       🧠 MINDSET MODAL
  ========================== -->
  <div id="mindsetModal" class="mindset-modal hidden">
    <!-- (sin cambios, se mantiene tal como lo tienes) -->
  </div>

  <!-- PROTECCIÓN -->
  <script type="module">
    import { protectPage } from "/js/router.js";
    protectPage({ allowedRoles: ["user"] });
  </script>

  <!-- HEADER -->
  <script type="module">
    import { loadHeader } from "/components/header.js";
    loadHeader();
  </script>

  <!-- LOGICA -->
  <script type="module" src="/js/lesson.js"></script>

</body>
</html>
