<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lección · Advance+</title>

  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/courses.css">

  <style>
    /* Extra mínimo para el flujo Step3 (no rompe tu diseño) */
    .sticky-coach {
      position: sticky;
      top: 14px;
      z-index: 20;
    }
    .coach-card.hidden { display:none; }
    .coach-card-actions { display:flex; gap:10px; margin-top:12px; }
    .coach-miniline { opacity:.9; font-size: 13px; margin-top: 6px; }
    .mindset-inline.hidden { display:none; }
    .section-divider { height:1px; opacity:.15; margin:14px 0; background: #fff; }
  </style>
</head>

<body class="app-bg dashboard-page">

  <!-- HEADER GLOBAL -->
  <div id="appHeader"></div>

<main class="lesson-page">

  <!-- 1. HEADER LECCIÓN -->
  <section id="lessonHeader" class="lesson-header block">
    <button id="btnBackToCourse" class="btn-outline">
      ← Volver al curso
    </button>

    <p id="lessonCourseLabel" class="lesson-course-label"></p>
    <h1 id="lessonTitle" class="lesson-title">Cargando lección...</h1>
    <p id="lessonSubtitle" class="lesson-subtitle"></p>

    <p id="lessonMeta" class="lesson-meta"></p>
  </section>

  <!-- 2. MICRO-CHEQUEO (CONDICIONAL) -->
  <section
    id="missionCheckinBlock"
    class="block coach-checkin hidden"
  >
    <h3 class="coach-checkin-title">Chequeo rápido</h3>

    <p class="coach-checkin-text">
      Ayer te propusiste una acción. ¿Cómo te fue?
    </p>

    <div class="coach-checkin-actions">
      <button data-result="done" class="btn-outline">
        ✅ La hice
      </button>
      <button data-result="partial" class="btn-outline">
        ⚠️ Parcial
      </button>
      <button data-result="skipped" class="btn-outline">
        ❌ No la hice
      </button>
    </div>

    <textarea
      id="missionCheckinNote"
      class="coach-checkin-note"
      placeholder="¿Qué fue lo más difícil? (opcional)"
      rows="3"
    ></textarea>

    <button
      id="missionCheckinContinue"
      class="btn btn-primary"
    >
      Continuar
    </button>
  </section>

  <!-- 3. CONTENIDO CENTRAL -->
  <section
    id="lessonContentBlock"
    class="block lesson-content-section"
  >
    <div
      id="lessonContentHtml"
      class="lesson-content"
    >
      <!-- HTML de la lección -->
    </div>

    <div
      id="lessonMedia"
      class="lesson-media"
    >
      <!-- audio / video / imagen -->
    </div>
  </section>

  <!-- 4. EJERCICIO DEL DÍA -->
  <section
    id="lessonExerciseBlock"
    class="block lesson-exercise-section"
  >
    <h2 class="section-title">
      Ejercicio del día
    </h2>

    <p
      id="lessonExerciseText"
      class="lesson-exercise-text"
    ></p>

    <textarea
      id="lessonExerciseInput"
      class="lesson-reflection-input"
      rows="6"
      placeholder="Escribe aquí tu reflexión, compromiso o aprendizaje clave..."
    ></textarea>

    <p class="lesson-save-note">
      Se guarda automáticamente
    </p>
  </section>

  <!-- 5. REGISTRO DE ESTADO (MINDSET) -->
  <section
    id="lessonMindsetBlock"
    class="block lesson-mindset-section"
  >
    <h2 class="section-title">
      Registro de estado
    </h2>

    <p class="lesson-mindset-subtitle">
      ¿Cómo terminas esta lección?
    </p>

    <!-- Mood -->
    <div
      id="mindsetMoodRow"
      class="mindset-mood-row"
    >
      <button type="button" data-value="1">😞</button>
      <button type="button" data-value="2">😕</button>
      <button type="button" data-value="3">😐</button>
      <button type="button" data-value="4">🙂</button>
      <button type="button" data-value="5">😄</button>
    </div>

    <!-- Sliders -->
    <div class="mindset-sliders">

      <div class="mindset-slider">
        <span>Enfoque</span>
        <input type="range" id="mindsetFocus" min="1" max="5" value="3" />
      </div>

      <div class="mindset-slider">
        <span>Energía</span>
        <input type="range" id="mindsetEnergy" min="1" max="5" value="3" />
      </div>

      <div class="mindset-slider">
        <span>Motivación</span>
        <input type="range" id="mindsetMotivation" min="1" max="5" value="3" />
      </div>

      <div class="mindset-slider">
        <span>Claridad</span>
        <input type="range" id="mindsetClarity" min="1" max="5" value="3" />
      </div>

      <div class="mindset-slider">
        <span>Confianza</span>
        <input type="range" id="mindsetConfidence" min="1" max="5" value="3" />
      </div>

    </div>
  </section>

  <!-- 6. COACH IA (UNA SOLA CARD) -->
  <section
    id="lessonCoachBlock"
    class="block coach-card hidden"
  >
    <h3 class="coach-card-title">
      Tu Coach
    </h3>

    <div
      id="coachMessage"
      class="coach-message"
    >
      <!-- mensaje IA -->
    </div>
  </section>

  <!-- 7. CTA PRINCIPAL -->
  <section
    id="lessonCtaBlock"
    class="block lesson-cta hidden"
  >
    <button
      id="btnCompleteLesson"
      class="btn btn-primary btn-large"
    >
      Continuar
    </button>
  </section>

  <!-- 8. FEEDBACK (COLAPSADO) -->
  <section
    id="lessonFeedbackBlock"
    class="block lesson-feedback-section"
  >
    <button
      id="toggleFeedback"
      class="btn-link"
    >
      ¿Quieres dejar un comentario sobre esta lección?
    </button>

    <div
      id="feedbackForm"
      class="hidden"
    >
      <div
        id="feedbackStars"
        class="feedback-stars"
      ></div>

      <textarea
        id="feedbackComment"
        class="lesson-reflection-input"
        rows="4"
        placeholder="Escribe aquí tu comentario (opcional)..."
      ></textarea>
    </div>
  </section>

  <!-- 9. CHAT IA (OPCIONAL, PERSISTENTE) -->
  <section
    id="lessonChatBlock"
    class="block coach-chat hidden"
  >
    <h3 class="coach-chat-title">
      Habla con tu Coach
    </h3>

    <div
      id="coachChatMessages"
      class="coach-chat-messages"
    ></div>

    <div class="coach-chat-input">
      <input
        id="coachChatInput"
        type="text"
        placeholder="Escribe tu mensaje..."
      />
      <button
        id="coachChatSend"
        class="btn btn-primary"
      >
        Enviar
      </button>
    </div>
  </section>

</main>


  <!-- TABBAR -->
  <nav class="tabbar">
    <button class="tab-btn" onclick="location.href='/dashboard/index.html'">
      <span>🏠</span><small>Inicio</small>
    </button>
    <button class="tab-btn active" onclick="location.href='/curso/index.html'">
      <span>📘</span><small>Retos</small>
    </button>
    <button class="tab-btn" onclick="location.href='/perfil/index.html'">
      <span>👤</span><small>Perfil</small>
    </button>
    <button class="tab-btn" onclick="location.href='/perfil/datos.html'">
      <span>📊</span><small>Progreso</small>
    </button>
  </nav>

  <!-- PROTECCIÓN POR ROL -->
  <script type="module">
    import { protectPage } from "/js/router.js";
    protectPage({ allowedRoles: ["user"] });
  </script>

  <!-- HEADER -->
  <script type="module">
    import { loadHeader } from "/components/header.js";
    loadHeader();
  </script>

  <!-- LÓGICA LECCIÓN -->
  <script type="module" src="/js/lesson.js"></script>

</body>
</html>
