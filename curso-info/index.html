<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Información del Curso | Advance+</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/curso-info.css" />
</head>

<body class="app-bg">

  <div id="appHeader"></div>
    <script type="module">
      import { loadHeader } from "/components/header.js";
      loadHeader();
    </script>

  <!-- HEADER 
  <header class="dash-header">
    <div class="dash-header-left">
      <div class="dash-logo">Advance+</div>
    </div>

    <div class="dash-header-right">
      <button id="btnLogout" class="btn-logout">Cerrar sesión</button>
    </div>
  </header> -->

  <main class="course-info-container">
    <div id="courseHero" class="course-hero"></div>

    <section class="course-content">
      <h1 id="courseTitle"></h1>
      <p id="courseSubtitle" class="course-sub"></p>

      <div id="courseCategory" class="course-category-tag"></div>

      <p id="courseDescription" class="course-description"></p>

      <div class="course-meta-box">
        <div><strong>Días:</strong> <span id="courseDays"></span></div>
        <div><strong>Nivel:</strong> <span id="courseLevel"></span></div>
        <div><strong>XP Total:</strong> <span id="courseXP"></span></div>
      </div>

      <div id="courseActionContainer"></div>

      <section class="course-modules">
        <h3>Qué incluye este curso</h3>
        <div id="courseModulesList" class="modules-list"></div>
      </section>

    </section>
  </main>

  <script type="module" src="/js/curso-info.js"></script>
  <script type="module" src="/js/header.js"></script>
</body>
</html>
