<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard | Advance+</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="app-bg">

  <!-- HEADER PREMIUM -->
  <header class="dash-header">
    <div class="dash-header-left">
      <div class="dash-logo">Advance+</div>

      <div class="dash-user-info">
        <div id="userAvatar" class="dash-avatar-placeholder">A+</div>
        <div class="dash-user-text">
          <div id="userName" class="dash-user-name">Usuario</div>
          <div id="userRole" class="dash-user-role">Miembro Advance+</div>
        </div>
      </div>
    </div>

    <div class="dash-header-right">
      <button id="btnLogout" class="btn-logout">Cerrar sesión</button>
      <button id="btnMenuMobile" class="btn-menu-mobile">☰</button>
    </div>
  </header>

  <!-- ----- MAIN CONTENT ----- -->
  <main class="dashboard-layout">

    <!-- SECCIÓN B — GAMIFICACIÓN -->
    <section class="dash-section gamification-section">
      <h2 class="section-title">Tu progreso</h2>

      <div class="gamification-grid">

        <div class="card gamification-card">
          <div class="card-header-row">
            <span class="card-label">Nivel</span>
            <span id="levelLabel" class="card-value">1</span>
          </div>

          <div class="xp-row">
            <div class="xp-info">
              <span id="xpTotalLabel" class="xp-total">0 XP</span>
              <span id="xpNextLabel" class="xp-next">100 XP para el siguiente nivel</span>
            </div>
            <div class="xp-bar">
              <div id="xpBarFill" class="xp-bar-fill"></div>
            </div>
          </div>
        </div>

        <div class="card gamification-card small-card">
          <div class="card-label">Racha actual</div>
          <div id="streakCurrent" class="card-big-number">0 🔥</div>
        </div>

        <div class="card gamification-card small-card">
          <div class="card-label">Mejor racha</div>
          <div id="streakBest" class="card-big-number">0 🏆</div>
        </div>

      </div>
    </section>

    <!-- SECCIÓN C — CURSOS ACTIVOS -->
    <section class="dash-section">
      <div class="section-header-row">
        <h2 class="section-title">Tus retos activos</h2>
        <span id="activeCount" class="section-subtitle"></span>
      </div>

      <div id="activeCoursesGrid" class="courses-grid"></div>

      <div class="course-actions">


      <p id="noActiveMessage" class="empty-message" style="display:none;">
        Aún no has comenzado ningún reto. Empieza por uno de los cursos recomendados abajo. 💪
      </p>
    </section>

    <!-- SECCIÓN D — EXPLORAR RETOS -->
    <section class="dash-section">
      <div class="section-header-row">
        <h2 class="section-title">Explorar retos</h2>
      </div>

      <div id="availableCoursesGrid" class="courses-grid"></div>

      <p id="noAvailableMessage" class="empty-message" style="display:none;">
        No hay más retos disponibles por ahora. 🚀
      </p>
    </section>

  </main>

  <!-- Router -->
  <script type="module">
    import { protectUserView } from "/js/router.js";
    protectUserView();
  </script>

  <!-- Dashboard logic -->
  <script type="module" src="/js/dashboard.js"></script>
</body>


</html>
