<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Advance+ · Dashboard</title>

  <!-- TOKENS GLOBALES 
  <link rel="stylesheet" href="/css/style.css">-->

  <!-- DASHBOARD CSS (Aislado para el dashboard) 
  <link rel="stylesheet" href="/css/dashboard-user.css">-->

  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/courses.css"><!-- si muestras cursos -->


</head>

<body class="app-bg dashboard-page">

  <!-- HEADER NUEVO (PREMIUM) -->
  <div id="appHeader"></div>




  <!-- ============================================================
       MAIN DASHBOARD
  ============================================================= -->
 <main class="app-bg dashboard-page">
  <div class="dashboard-wrapper">

    <!-- 1. TU PROGRESO -->
    <section class="dash-section gamification-section">
      <h2 class="section-title">Tu progreso</h2>
      <div class="gamification-grid">
        <!-- Card Racha -->
        <div class="card" id="cardStreak">
          <!-- contenido racha -->
        </div>
        <!-- Card Nivel -->
        <div class="card" id="cardLevel">
          <!-- contenido nivel -->
        </div>
        <!-- (si quieres) un 3er slot: días activos / XP hoy -->
      </div>
    </section>

    <!-- 2. MISIÓN DEL DÍA -->
    <section class="dash-section">
      <h2 class="section-title">Misión del día</h2>
      <div id="missionCard" class="mission-card">
        <!-- misión se rellena desde dashboard.js -->
      </div>
    </section>

    <!-- 3. COACH IA - MENSAJE DE HOY -->
    <section class="dash-section">
      <div id="coachMessageCard" class="coach-message-card">
        <!-- mensaje coach ia se rellena por JS -->
      </div>
    </section>

    <!-- 4. TUS RETOS ACTIVOS (CARRUSEL) -->
    <section class="dash-section">
      <div class="section-header-row">
        <h2 class="section-title">Tus retos activos</h2>
        <span id="activeChallengesCount" class="section-subtitle">0 activos</span>
      </div>

      <div id="activeChallengesCarousel" class="courses-carousel">
        <!-- aquí van las tarjetas horizontales -->
      </div>
      <p id="noActiveChallenges" class="empty-message" style="display:none;">
        Aún no tienes retos activos. Empieza con AI7 o el Curso de Bienvenida.
      </p>
    </section>

    <!-- 5. EXPLORAR RETOS (GRID) -->
    <section class="dash-section">
      <h2 class="section-title">Explorar retos</h2>
      <div id="coursesGrid" class="courses-grid">
        <!-- tarjetas de cursos -->
      </div>
    </section>

  </div>

  <!-- TABBAR -->
  <nav class="tabbar">
    <!-- botones Inicio / Retos / Perfil / Progreso -->
  </nav>
</main>



  <!-- ============================================================
       TAB BAR — restaurado EXACTAMENTE como las otras páginas
  ============================================================= -->
  <nav class="tabbar">
    <button class="tab-btn active" onclick="location.href='/dashboard/index.html'">
      <span>🏠</span>
      <small>Inicio</small>
    </button>

    <button class="tab-btn" onclick="location.href='/perfil/cursos.html'">
      <span>📘</span>
      <small>Retos</small>
    </button>

    <button class="tab-btn" onclick="location.href='/perfil/datos.html'">
      <span>👤</span>
      <small>Perfil</small>
    </button>

    <button class="tab-btn" onclick="location.href='/perfil/stats.html'">
      <span>📊</span>
      <small>Progreso</small>
    </button>
  </nav>




  <!-- HEADER -->
  <script type="module">
    import { loadUserHeader } from "/components/user-header.js";
    loadUserHeader();
  </script>

  <!-- ROUTER -->
  <script type="module">
    import { protectUserView } from "/js/router.js";
    protectUserView();
  </script>

  <!-- LÓGICA DASHBOARD -->
  <script type="module" src="/js/dashboard.js"></script>

</body>
</html>
