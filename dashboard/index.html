<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Advance+ · Dashboard</title>

  <!-- TOKENS GLOBALES -->
  <link rel="stylesheet" href="/css/style.css">

  <!-- DASHBOARD CSS -->
  <link rel="stylesheet" href="/css/dashboard.css">
</head>

<body class="app-bg">

  <!-- HEADER NUEVO (PREMIUM) -->
  <header class="ap-header">
    <div class="ap-header-left">
      <h1 class="ap-logo">A+</h1>
      <div class="ap-header-info">
        <span id="headerUserName" class="ap-header-name">Usuario</span>
        <span id="headerUserRole" class="ap-header-role">Cargando…</span>
      </div>
    </div>

    <button id="btnLogout" class="ap-logout-btn">Cerrar sesión</button>
  </header>


  <!-- CONTENIDO PRINCIPAL -->
  <main class="dashboard-wrapper">

    <!-- SECCIÓN A — GAMIFICACIÓN -->
    <section class="dash-section gamification-box">
      <h2 class="section-title">Tu progreso</h2>

      <div class="gamification-grid">

        <!-- XP / NIVEL -->
        <div class="card gamif-card big-card">
          <div class="card-row">
            <span class="card-label">Nivel</span>
            <span id="userLevel" class="card-level">1</span>
          </div>

          <div class="xp-info-row">
            <div>
              <span id="xpTotal" class="xp-total">0 XP</span>
              <span id="xpNextText" class="xp-next">...</span>
            </div>

            <div class="xp-bar">
              <div id="xpBarFill" class="xp-bar-fill"></div>
            </div>
          </div>
        </div>

        <!-- Racha -->
        <div class="card gamif-card small-card">
          <span class="card-label">Racha actual</span>
          <span id="streakCurrent" class="card-number">0 🔥</span>
        </div>

        <!-- Mejor racha -->
        <div class="card gamif-card small-card">
          <span class="card-label">Mejor racha</span>
          <span id="streakBest" class="card-number">0 🏆</span>
        </div>

      </div>
    </section>


    <!-- SECCIÓN B — CURSOS ACTIVOS -->
    <section class="dash-section">
      <div class="section-header-row">
        <h2 class="section-title">Tus retos activos</h2>
        <span id="activeCount" class="section-subtitle"></span>
      </div>

      <div id="activeCoursesGrid" class="courses-grid"></div>

      <p id="noActiveMessage" class="empty-message" style="display:none;">
        No has comenzado ningún reto todavía. 🚀  
      </p>
    </section>


    <!-- SECCIÓN C — EXPLORAR -->
    <section class="dash-section">
      <h2 class="section-title">Explorar retos</h2>

      <div id="availableCoursesGrid" class="courses-grid"></div>

      <p id="noAvailableMessage" class="empty-message" style="display:none;">
        No hay más retos disponibles en este momento. 🔥
      </p>
    </section>

  </main>


  <!-- TAB BAR MÓVIL -->
  <nav class="tabbar">
    <button class="tab-btn active" data-nav="dashboard">
      <span>🏠</span>
      <small>Inicio</small>
    </button>

    <button class="tab-btn" data-nav="courses">
      <span>📘</span>
      <small>Retos</small>
    </button>

    <button class="tab-btn" data-nav="profile">
      <span>👤</span>
      <small>Perfil</small>
    </button>

    <button class="tab-btn" data-nav="stats">
      <span>📊</span>
      <small>Progreso</small>
    </button>
  </nav>


  <!-- ROUTER + LOGICA -->
  <script type="module">
    import { protectUserView } from "/js/router.js";
    protectUserView();
  </script>

  <!-- NUEVA LÓGICA DASHBOARD -->
  <script type="module" src="/js/dashboard.js"></script>

</body>
</html>
