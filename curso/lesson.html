<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lección · Advance+</title>

  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/courses.css">
</head>

<body class="app-bg dashboard-page">

  <!-- HEADER GLOBAL -->
  <div id="appHeader"></div>

<main class="dashboard-main">
  <div class="dashboard-wrapper">

    <!-- ENCABEZADO LECCIÓN -->
    <section class="dash-section lesson-header-section">
      <button class="btn-outline lesson-back-btn" id="lessonBackBtn">
        ← Volver al curso
      </button>

      <p class="lesson-course-label" id="lessonCourseLabel"></p>
      <h1 class="lesson-title" id="lessonTitle">Cargando lección...</h1>
      <p class="lesson-subtitle" id="lessonSubtitle"></p>

      <p class="lesson-meta" id="lessonMeta"></p>
    </section>

    <!-- CONTENIDO PRINCIPAL -->
    <section class="dash-section lesson-content-section">
      <div id="lessonContent" class="lesson-content"></div>

      <div id="lessonMedia" class="lesson-media"></div>
    </section>

    <!-- EJERCICIO / REFLEXIÓN -->
    <section class="dash-section lesson-exercise-section">
      <h2 class="section-title">Ejercicio del día</h2>
      <p id="lessonExerciseText" class="lesson-exercise-text">
        Escribe aquí tu reflexión o lo que vas a aplicar hoy.
      </p>

      <textarea id="lessonReflectionInput" class="lesson-reflection-input" rows="6"
        placeholder="Escribe tus ideas, compromisos o aprendizajes clave..."></textarea>

      <p class="lesson-save-note" id="lessonSaveNote">Se guarda automáticamente.</p>
    </section>

    <!-- NAVEGACIÓN ENTRE LECCIONES (NUEVO) -->
    <section class="dash-section lesson-navigation-section">
      <div class="lesson-nav-grid">
        <button class="btn-outline lesson-nav-btn" id="prevLessonBtn">
          ← Lección anterior
        </button>

        <button class="btn-outline lesson-nav-btn" id="nextLessonBtn">
          Siguiente lección →
        </button>
      </div>
    </section>

    <!-- CTA COMPLETAR -->
    <section class="dash-section lesson-complete-section">
      <button class="btn btn-primary" id="completeLessonBtn">
        Marcar lección como completada
      </button>
    </section>

  </div>
</main>


  <!-- MODAL FEEDBACK -->
  <div class="lesson-feedback-modal hidden" id="feedbackModal">
    <div class="lesson-feedback-card">
      <h2>¿Cómo te sentiste con esta lección?</h2>
      <p>Tu feedback nos ayuda a mejorar y personalizar tu experiencia.</p>

      <div class="feedback-stars" id="feedbackStars">
        <!-- estrellas por JS -->
      </div>

      <textarea id="feedbackComment" class="lesson-reflection-input" rows="4"
        placeholder="Escribe aquí lo que más te ayudó o qué mejorarías (opcional)"></textarea>

      <div class="feedback-actions">
        <button class="btn-outline" id="feedbackSkipBtn">Saltar</button>
        <button class="btn btn-primary" id="feedbackSendBtn">Enviar y continuar</button>
      </div>
    </div>
  </div>

  <!-- TABBAR -->
  <nav class="tabbar">
    <button class="tab-btn" onclick="location.href='/dashboard/index.html'">
      <span>🏠</span>
      <small>Inicio</small>
    </button>

    <button class="tab-btn active" onclick="location.href='/curso/index.html'">
      <span>📘</span>
      <small>Retos</small>
    </button>

    <button class="tab-btn" onclick="location.href='/perfil/index.html'">
      <span>👤</span>
      <small>Perfil</small>
    </button>

    <button class="tab-btn" onclick="location.href='/perfil/datos.html'">
      <span>📊</span>
      <small>Progreso</small>
    </button>
  </nav>

  <!-- PROTECCIÓN POR ROL -->
  <script type="module">
    import { protectPage } from "/js/router.js";
    protectPage({ allowedRoles: ["user"] });
  </script>

  <!-- HEADER -->
  <script type="module">
    import { loadHeader } from "/components/header.js";
    loadHeader();
  </script>

  <!-- LÓGICA LECCIÓN -->
  <script type="module" src="/js/lesson.js"></script>

</body>
</html>
