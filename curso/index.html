<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Curso · Advance+</title>

  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/courses.css">
</head>

<body class="app-bg dashboard-page">

  <!-- HEADER GLOBAL -->
  <div id="appHeader"></div>

  <main class="dashboard-main">
    <div class="dashboard-wrapper">

      <!-- HERO DEL CURSO -->
      <section class="dash-section" id="courseHero">
        <p class="course-category-label" id="courseCategoryLabel"></p>
        <h1 class="course-main-title" id="courseTitleHero">Cargando curso...</h1>
        <p class="course-subtitle-hero" id="courseSubtitleHero"></p>

        <div class="course-hero-grid">
          <div class="course-hero-left">
            <p class="course-short-promise" id="courseShortPromise"></p>

            <div class="course-meta-hero" id="courseMetaHero">
              <!-- nivel, duración, reviews -->
            </div>

            <div class="course-progress-wrapper">
              <div class="course-progress-top">
                <span id="courseProgressLabel">Progreso: 0%</span>
                <span id="courseProgressDays">0 / 0 días</span>
              </div>
              <div class="course-progress-bar">
                <div class="course-progress-fill" id="courseProgressFill"></div>
              </div>
            </div>

            <button class="btn btn-primary course-cta-btn" id="courseCtaBtn">
              Continuar reto
            </button>

            <p class="course-cta-note" id="courseCtaNote"></p>
          </div>

          <div class="course-hero-right">
            <div class="course-hero-image" id="courseHeroImage"></div>
          </div>
        </div>
      </section>

      <!-- LISTA DE LECCIONES -->
      <section class="dash-section">
        <h2 class="section-title">Lecciones del reto</h2>
        <div id="lessonsList" class="lessons-list">
          <!-- items por JS -->
        </div>
      </section>

    </div>
  </main>

  <!-- TABBAR GLOBAL -->
  <nav class="tabbar">
    <button class="tab-btn" onclick="location.href='/dashboard/index.html'">
      <span>🏠</span>
      <small>Inicio</small>
    </button>

    <button class="tab-btn active" onclick="location.href='/curso/index.html'">
      <span>📘</span>
      <small>Retos</small>
    </button>

    <button class="tab-btn" onclick="location.href='/perfil/index.html'">
      <span>👤</span>
      <small>Perfil</small>
    </button>

    <button class="tab-btn" onclick="location.href='/perfil/datos.html'">
      <span>📊</span>
      <small>Progreso</small>
    </button>
  </nav>

  <!-- PROTECCIÓN POR ROL -->
  <script type="module">
    import { protectPage } from "/js/router.js";
    protectPage({ allowedRoles: ["user"] });
  </script>

  <!-- HEADER -->
  <script type="module">
    import { loadHeader } from "/components/header.js";
    loadHeader();
  </script>

  <!-- LÓGICA DEL CURSO -->
  <script type="module" src="/js/course-index.js"></script>

</body>
</html>
