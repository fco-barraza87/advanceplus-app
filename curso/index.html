<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Curso | Advance+</title>

  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
</head>

<body class="app-bg">

  <!-- HEADER DEL CURSO -->
  <header class="course-header">
    <div class="course-header-left">
      <button id="btnBack" class="btn-back">←</button>

      <div>
        <h1 id="courseTitle" class="course-title">Cargando…</h1>
        <p id="courseSubtitle" class="course-subtitle"></p>
        <p id="courseCategory" class="course-category"></p>
        <span id="courseXpHeader"></span>
      </div>
    </div>

    <div class="course-header-right">
      <div class="course-xp-chip">
        <span>XP total</span>
        <strong id="courseXpReward">+0 XP</strong>
      </div>
    </div>
  </header>


  <!-- LAYOUT PRINCIPAL DEL CURSO -->
  <main class="course-layout">

  <!-- TIMELINE / DÍAS -->
  <div class="course-timeline-card">
    <p class="course-progress-text" id="courseProgressText">Progreso: 0%</p>
    <div class="progress-bar-container">
    <div id="progressBarFill" class="progress-bar-fill"></div>
  </div>
    <div id="timelineDays" class="day-timeline"></div>
  </div>
  <div class="course-progress-wrapper">
  <div id="courseProgressBar" class="progress-bar-bg">
    <div id="courseProgressFill" class="progress-bar-fill"></div>
    </div>
  </div>




    <!-- CONTENIDO DE LECCIÓN -->
    <section class="course-main">
      <article id="lessonContainer" class="lesson-card">

        <div class="lesson-header">
          <span id="lessonDayLabel" class="lesson-day-label"></span>
          <h2 id="lessonTitle" class="lesson-title">Cargando…</h2>
          <p id="lessonSubtitle" class="lesson-subtitle"></p>
        </div>

        <div id="lessonImageWrapper" class="lesson-image-wrapper" style="display:none;">
          <img id="lessonImage" class="lesson-image"/>
        </div>

        <div id="lessonBody" class="lesson-body"></div>

        <div id="lessonExercise" class="lesson-exercise" style="display:none;"></div>

        <footer class="lesson-footer">
          <span id="lessonXp" class="lesson-xp">+0 XP</span>
          <button id="btnCompletar" class="btn-course">Marcar como completado</button>
          <button id="btnSiguiente" class="btn-course-secondary" style="margin-top:10px;">
            Siguiente →
            </button>

        </footer>
      </article>
    </section>

    <!-- Imagen -->
    <div id="lessonImageWrapper" class="lesson-image-wrapper" style="display:none;">
    <img id="lessonImage" class="lesson-image"/>
    </div>

    <!-- Audio -->
    <div id="lessonAudioWrapper" class="lesson-audio-wrapper" style="display:none;">
    <p class="lesson-audio-label">Audio</p>
    <audio id="lessonAudio" controls class="lesson-audio"></audio>
    </div>

    <!-- Texto -->
    <div id="lessonBody" class="lesson-body"></div>

    <!-- Ejercicio -->
    <div id="lessonExercise" class="lesson-exercise" style="display:none;"></div>


  </main>

  <script type="module" src="/js/curso.js"></script>
</body>
</html>
