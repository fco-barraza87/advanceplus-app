<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login · Advance+</title>

  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>

<body class="app-bg">

  <main class="auth-container">
    <div class="auth-box">

      <h1 class="auth-title">Bienvenido</h1>
      <p class="auth-subtitle">Inicia sesión para continuar</p>

      <!-- FORMULARIO LOGIN -->
      <form id="loginForm" class="auth-form">
        <label>Email</label>
        <input type="email" id="email" required placeholder="tu@correo.com" />

        <label>Contraseña</label>
        <input type="password" id="password" required placeholder="••••••••" />

        <button type="submit" class="btn-primary auth-btn">Ingresar</button>
      </form>

      <p class="auth-switch">
        ¿No tienes cuenta?  
        <a href="/auth/register.html">Crear cuenta</a>
      </p>

      <p id="authMessage" class="auth-message"></p>

    </div>
  </main>

  <script type="module">
    import { signIn } from "/js/auth.js";

    const form = document.getElementById("loginForm");
    const msg  = document.getElementById("authMessage");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.textContent = "Ingresando...";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        await signIn(email, password);
        msg.textContent = "Éxito, redirigiendo...";
        window.location.href = "/app.html";
      } catch (error) {
        msg.textContent = error.message ?? "Error al iniciar sesión";
      }
    });
  </script>

</body>
</html>
