<!-- ============================================================
     HEADER PREMIUM A+ CON MENÚ AVATAR + SCROLL SHRINK
     /components/header.html
============================================================ -->

<header id="apHeader" class="ap-header">
  
  <!-- IZQUIERDA -->
  <div class="ap-header-left">
    <div class="ap-logo">A+</div>

    <div class="ap-header-info">
      <span id="headerUserName" class="ap-header-name">Usuario</span>
      <span id="headerUserRole" class="ap-header-role">Cargando…</span>
    </div>
  </div>

  <!-- AVATAR + MENÚ -->
  <div class="ap-header-right">
    <div id="headerAvatar" class="ap-header-avatar">U</div>

    <!-- DROPDOWN -->
    <div id="userMenu" class="ap-user-menu hidden">
      <button onclick="location.href='/perfil/datos.html'">👤 Ver perfil</button>
      <button onclick="location.href='/perfil/cursos.html'">📘 Mis retos</button>
      <button onclick="location.href='/perfil/configuracion.html'">⚙️ Configuración</button>
      <button id="logoutMiniBtn">🚪 Cerrar sesión</button>
    </div>
  </div>

</header>

<style>
/* ============================================================
   BASE STYLES
============================================================ */
.ap-header {
  width: 100%;
  height: 68px;
  background: rgba(15, 30, 68, 0.85);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(255, 255, 255, 0.07);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  position: sticky;
  top: 0;
  z-index: 100;
  transition: all 0.25s ease;
}

/* HEADER COLAPSADO */
.ap-header.shrink {
  height: 54px;
  padding: 0 14px;
}

/* LOGO */
.ap-logo {
  font-size: 28px;
  font-weight: 800;
  color: #C0A450;
  transition: transform 0.25s ease, font-size 0.25s ease;
}

.ap-header.shrink .ap-logo {
  font-size: 22px;
  transform: translateY(1px);
}

/* INFO (nombre + rol) */
.ap-header-info {
  display: flex;
  flex-direction: column;
}

.ap-header-name {
  font-size: 16px;
  font-weight: 600;
  color: white;
  transition: font-size 0.25s ease;
}

.ap-header-role {
  font-size: 12px;
  color: rgba(255,255,255,0.7);
}

/* AVATAR */
.ap-header-avatar {
  width: 42px;
  height: 42px;
  background: rgba(255,255,255,0.10);
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
  font-weight: 600;
  font-size: 16px;
  margin-left: 14px;
  cursor: pointer;
  overflow: hidden;
  transition: all 0.25s ease;
}

.ap-header.shrink .ap-header-avatar {
  width: 36px;
  height: 36px;
}

/* ============================================================
   MENU DESPLEGABLE (AVATAR MENU)
============================================================ */
.ap-user-menu {
  position: absolute;
  top: 70px;
  right: 18px;
  background: #ffffff10;
  backdrop-filter: blur(16px);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 12px;
  padding: 10px 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 180px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.25);
  transform-origin: top right;
  opacity: 1;
  transition: all 0.2s ease;
}

/* Oculto */
.hidden {
  opacity: 0;
  transform: scale(0.96) translateY(-8px);
  pointer-events: none;
}

.ap-user-menu button {
  background: transparent;
  border: none;
  text-align: left;
  width: 100%;
  padding: 10px 16px;
  color: white;
  font-size: 14px;
  cursor: pointer;
  transition: background 0.15s ease;
}

.ap-user-menu button:hover {
  background: rgba(255,255,255,0.12);
}

/* RESPONSIVE */
@media (max-width: 480px) {
  .ap-header {
    padding: 0 12px;
  }
}
</style>

<script>
/* ============================================================
   INTERACCIÓN: MENU EN AVATAR
============================================================ */
document.addEventListener("click", (e) => {
  const avatar = document.getElementById("headerAvatar");
  const menu = document.getElementById("userMenu");

  if (!avatar || !menu) return;

  if (avatar.contains(e.target)) {
    menu.classList.toggle("hidden");
  } else if (!menu.contains(e.target)) {
    menu.classList.add("hidden");
  }
});

/* Mini-logout dentro del menú */
document.addEventListener("DOMContentLoaded", () => {
  const btn = document.getElementById("logoutMiniBtn");
  if (btn) {
    btn.onclick = async () => {
      const { supabase } = await import("/js/supabase.js");
      await supabase.auth.signOut();
      window.location.href = "/index.html";
    };
  }
});

/* ============================================================
   HEADER SHINK AL HACER SCROLL
============================================================ */
let lastScroll = 0;

window.addEventListener("scroll", () => {
  const header = document.getElementById("apHeader");
  const current = window.scrollY;

  if (current > lastScroll && current > 20) {
    header.classList.add("shrink");
  } else {
    header.classList.remove("shrink");
  }

  lastScroll = current;
});
</script>
