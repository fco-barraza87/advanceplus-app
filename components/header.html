<!-- ============================================================
     HEADER PREMIUM A+ — 2025 VERSION
============================================================ -->

<header id="apHeader" class="ap-header">
  
  <!-- IZQUIERDA -->
  <div class="ap-header-left">
    <div class="ap-logo">A+</div>

    <div class="ap-header-info">
      <span id="headerUserName" class="ap-header-name">Usuario</span>
      <span id="headerUserRole" class="ap-header-role">Cargando…</span>
    </div>
  </div>

  <!-- AVATAR + MENÚ -->
  <div class="ap-header-right">
    <div id="headerAvatar" class="ap-header-avatar">U</div>

    <!-- MENU DESPLEGABLE -->
    <div id="userMenu" class="ap-user-menu hidden">
      
      <button class="menu-btn" onclick="location.href='/perfil/datos.html'">
        <span class="icon">👤</span> Ver perfil
      </button>

      <button class="menu-btn" onclick="location.href='/perfil/cursos.html'">
        <span class="icon">📘</span> Mis retos
      </button>

      <button class="menu-btn" onclick="location.href='/perfil/configuracion.html'">
        <span class="icon">⚙️</span> Configuración
      </button>

      <div class="menu-divider"></div>

      <button class="menu-btn logout-btn" id="logoutMiniBtn">
        <span class="icon">🚪</span> Cerrar sesión
      </button>

    </div>
  </div>

</header>

<style>
/* ============================================================
   CONTAINER DEL HEADER
============================================================ */
.ap-header {
  width: 100%;
  height: 70px;
  background: rgba(15, 30, 68, 0.82);
  backdrop-filter: blur(14px) saturate(160%);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid rgba(255, 255, 255, 0.10);
  
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;

  position: sticky;
  top: 0;
  z-index: 200;

  transition: all 0.25s ease;
}

/* COLAPSADO */
.ap-header.shrink {
  height: 56px;
  padding: 0 16px;
}

/* LOGO */
.ap-logo {
  font-size: 28px;
  font-weight: 800;
  color: #C0A450;
}

/* NOMBRE + ROL */
.ap-header-info {
  display: flex;
  flex-direction: column;
  margin-left: 10px;
}

.ap-header-name {
  color: white;
  font-size: 17px;
  font-weight: 600;
}

.ap-header-role {
  color: rgba(255,255,255,0.65);
  font-size: 13px;
}

/* AVATAR */
.ap-header-avatar {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: rgba(255,255,255,0.12);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  cursor: pointer;

  font-weight: 600;
  color: transparent; /* oculta inicial cuando hay imagen */
  background-size: cover;
  background-position: center;
  margin-left: 20px;

  transition: all 0.25s ease;
}

.ap-header.shrink .ap-header-avatar {
  width: 36px;
  height: 36px;
}

/* ============================================================
   MENÚ DESPLEGABLE
============================================================ */
.ap-user-menu {
  position: absolute;
  top: 74px;
  right: 18px;
  min-width: 210px;

  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(22px) saturate(150%);
  border: 1px solid rgba(255,255,255,0.22);
  border-radius: 18px;

  box-shadow:
    0 12px 28px rgba(0,0,0,0.25),
    0 4px 8px rgba(0,0,0,0.15);

  padding: 10px 0;
  display: flex;
  flex-direction: column;
  gap: 4px;

  transform: scale(0.92) translateY(-8px);
  opacity: 0;
  pointer-events: none;
  transition: all 0.22s cubic-bezier(0.3, 0.14, 0.2, 1);
}

/* Visible */
.ap-user-menu:not(.hidden) {
  transform: scale(1) translateY(0);
  opacity: 1;
  pointer-events: auto;
}

/* Botones del menú */
.menu-btn {
  width: 100%;
  border: none;
  background: transparent;
  color: white;
  font-size: 15px;

  display: flex;
  align-items: center;
  gap: 12px;

  padding: 12px 18px;
  cursor: pointer;

  transition: all 0.18s ease;
}

.menu-btn .icon {
  font-size: 16px;
  opacity: 0.9;
}

.menu-btn:hover {
  background: rgba(255,255,255,0.18);
  padding-left: 26px;
}

/* Divider */
.menu-divider {
  width: 100%;
  height: 1px;
  background: rgba(255,255,255,0.15);
  margin: 6px 0;
}

/* Botón salir */
.logout-btn {
  color: #ffb3b3;
}

.logout-btn:hover {
  background: rgba(255, 99, 99, 0.20);
}

/* RESPONSIVE */
@media (max-width: 480px) {
  .ap-header {
    padding: 0 14px;
  }
}
</style>

<script>
/* ============================================================
   INTERACCIÓN DEL MENÚ
============================================================ */
document.addEventListener("click", (e) => {
  const avatar = document.getElementById("headerAvatar");
  const menu = document.getElementById("userMenu");

  if (!avatar || !menu) return;

  if (avatar.contains(e.target)) {
    menu.classList.toggle("hidden");
  } else if (!menu.contains(e.target)) {
    menu.classList.add("hidden");
  }
});

/* Logout dentro del menú */
document.addEventListener("DOMContentLoaded", () => {
  const btn = document.getElementById("logoutMiniBtn");
  if (btn) {
    btn.onclick = async () => {
      const { supabase } = await import("/js/supabase.js");
      await supabase.auth.signOut();
      window.location.href = "/index.html";
    };
  }
});

/* ============================================================
   EFECTO SHRINK AL SCROLLEAR
============================================================ */
let lastScroll = 0;

window.addEventListener("scroll", () => {
  const header = document.getElementById("apHeader");
  const current = window.scrollY;

  if (current > lastScroll && current > 20) {
    header.classList.add("shrink");
  } else {
    header.classList.remove("shrink");
  }

  lastScroll = current;
});
</script>
