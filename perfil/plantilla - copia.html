<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Advance+ · TITULO</title>

  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css"> <!-- reutilizamos estilo -->
</head>

<body class="app-bg">

  <!-- HEADER PREMIUM -->
  <div id="appHeader"></div>
  <script type="module">
    import { loadUserHeader } from "/components/user-header.js";
    loadUserHeader();
  </script>

  <!-- CONTENIDO PRINCIPAL -->
  <section class="dash-section">
    <h2 class="section-title">Progreso general</h2>

    <div class="card">
      <p><strong>Total XP:</strong> <span id="statXP">0</span></p>
      <p><strong>Nivel:</strong> <span id="statLevel">1</span></p>
      <p><strong>Retos completados:</strong> <span id="statCompleted">0</span></p>
    </div>
  </section>



  </main>

  <!-- TAB BAR MÓVIL -->
  <nav class="tabbar">
    <button class="tab-btn" data-nav="dashboard">
      <span>🏠</span><small>Inicio</small>
    </button>

    <button class="tab-btn" data-nav="courses">
      <span>📘</span><small>Retos</small>
    </button>

    <button class="tab-btn" data-nav="profile">
      <span>👤</span><small>Perfil</small>
    </button>

    <button class="tab-btn" data-nav="stats">
      <span>📊</span><small>Progreso</small>
    </button>
  </nav>

  <!-- ROUTER -->
  <script type="module">
    import { protectUserView } from "/js/router.js";
    protectUserView();
  </script>

  <!-- JS ESPECÍFICO -->
  <script type="module" src="/js/ARCHIVO.js"></script>

</body>
</html>
