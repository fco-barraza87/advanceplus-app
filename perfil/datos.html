<!-- ===============================================
     DATOS PERSONALES — Advance+
================================================ -->

<section class="module-section">

  <h2 class="module-title">Datos personales</h2>
  <p class="module-subtitle">Actualiza tu información básica para personalizar tu experiencia A+.</p>

  <form id="form-datos" class="module-form">

    <!-- Nombre -->
    <div class="form-group">
      <label for="inputFullName">Nombre completo</label>
      <input type="text" id="inputFullName" placeholder="Tu nombre" />
    </div>

    <!-- Email (solo lectura) -->
    <div class="form-group">
      <label for="inputEmail">Email</label>
      <input type="email" id="inputEmail" readonly disabled />
      <small class="helper-text">*El email se gestiona desde Seguridad.</small>
    </div>

    <!-- País -->
    <div class="form-group">
      <label for="inputPais">País</label>
      <select id="inputPais">
        <option value="">Selecciona tu país</option>
        <option value="chile">Chile</option>
        <option value="suiza">Suiza</option>
        <option value="espana">España</option>
        <option value="mexico">México</option>
        <option value="argentina">Argentina</option>
        <option value="colombia">Colombia</option>
        <option value="otro">Otro</option>
      </select>
    </div>

    <!-- Idioma -->
    <div class="form-group">
      <label for="inputIdioma">Idioma preferido</label>
      <select id="inputIdioma">
        <option value="es">Español</option>
        <option value="en">Inglés</option>
      </select>
    </div>

    <!-- Fecha de nacimiento -->
    <div class="form-group">
      <label for="inputNacimiento">Fecha de nacimiento</label>
      <input type="date" id="inputNacimiento" />
    </div>

    <!-- Guardar -->
    <button class="btn-a" type="submit">Guardar cambios</button>
    <p id="datosMsg" class="form-msg"></p>

  </form>
</section>



<style>
  /* Tus estilos originales + fix de select */
  select,
  input {
    background: rgba(255,255,255,0.08);
    color: white;
    border: 1px solid rgba(255,255,255,0.2);
  }

  select option {
    background: #0F1E44;
    color: white;
  }
</style>

input {

<!-- ====== JS (Opcional) ====== -->
<script type="module">
  import { supabase } from "/js/supabase.js";

  document.addEventListener("DOMContentLoaded", async () => {

    // Obtener usuario
    const { data: session } = await supabase.auth.getUser();
    if (!session?.user) return;

    const user = session.user;

    // Rellenar campos
    document.getElementById("nombre").value =
      user.user_metadata?.full_name || "";

    document.getElementById("email").value = user.email;

    document.getElementById("pais").value =
      user.user_metadata?.pais || "";

    document.getElementById("idioma").value =
      user.user_metadata?.idioma || "es";

    document.getElementById("nacimiento").value =
      user.user_metadata?.nacimiento || "";

    // Guardar cambios
    document.getElementById("form-datos").onsubmit = async (e) => {
      e.preventDefault();

      const msg = document.getElementById("datosMsg");
      msg.textContent = "Guardando...";

    const updates = {
        full_name: document.getElementById("nombre").value,
        pais: document.getElementById("pais").value,
        idioma: document.getElementById("idioma").value,
        birthdate: document.getElementById("nacimiento").value,
        updated_at: new Date()
    };


      const { error } = await supabase.auth.updateUser({
        data: updates
      });

      msg.style.color = error ? "#ff6b6b" : "#3ee98a";
      msg.textContent = error ? "Error guardando" : "Guardado con éxito ✔";
    };
  });
</script>
