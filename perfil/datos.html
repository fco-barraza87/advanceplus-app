<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Advance+ · TITULO</title>

  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css"> <!-- reutilizamos estilo -->
</head>

<body class="app-bg">

  <!-- HEADER PREMIUM -->
  <div id="appHeader"></div>
  <script type="module">
    import { loadUserHeader } from "/components/user-header.js";
    loadUserHeader();
  </script>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="dashboard-wrapper">
    <!-- Aquí va el contenido personalizado -->
  <section class="dash-section">
    <h2 class="section-title">Mi perfil</h2>

    <div class="card">
      <p><strong>Nombre:</strong> <span id="p_nombre">Cargando...</span></p>
      <p><strong>Email:</strong> <span id="p_email">Cargando...</span></p>
      <p><strong>Rol:</strong> <span id="p_role">Cargando...</span></p>
      <p><strong>País:</strong> <span id="p_country">Cargando...</span></p>
      <p><strong>Miembro desde:</strong> <span id="p_created">Cargando...</span></p>
    </div>
  </section>

  </main>

  <!-- TAB BAR MÓVIL -->
  <nav class="tabbar">
    <button class="tab-btn" data-nav="dashboard">
      <span>🏠</span><small>Inicio</small>
    </button>

    <button class="tab-btn" data-nav="courses">
      <span>📘</span><small>Retos</small>
    </button>

    <button class="tab-btn" data-nav="profile">
      <span>👤</span><small>Perfil</small>
    </button>

    <button class="tab-btn" data-nav="stats">
      <span>📊</span><small>Progreso</small>
    </button>
  </nav>

  <!-- ROUTER -->
  <script type="module">
    import { protectUserView } from "/js/router.js";
    protectUserView();
  </script>

  <!-- JS ESPECÍFICO -->
  <script type="module" src="/js/perfil.js"></script>

</body>
</html>
