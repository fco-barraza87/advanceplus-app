<!-- ===============================================
     DATOS PERSONALES — Advance+
     Módulo para /perfil/index.html
================================================ -->

<section class="module-section">

  <h2 class="module-title">Datos personales</h2>
  <p class="module-subtitle">Actualiza tu información básica para personalizar tu experiencia A+.</p>

  <form id="form-datos" class="module-form">

    <!-- Nombre -->
    <div class="form-group">
      <label for="nombre">Nombre completo</label>
      <input type="text" id="nombre" placeholder="Tu nombre" />
    </div>

    <!-- Email (solo lectura) -->
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" readonly disabled />
      <small class="helper-text">*El email se gestiona desde Seguridad.</small>
    </div>

    <!-- País -->
    <div class="form-group">
      <label for="pais">País</label>
      <select id="pais">
        <option value="">Selecciona tu país</option>
        <option value="chile">Chile</option>
        <option value="suiza">Suiza</option>
        <option value="espana">España</option>
        <option value="mexico">México</option>
        <option value="argentina">Argentina</option>
        <option value="colombia">Colombia</option>
        <option value="otro">Otro</option>
      </select>
    </div>

    <!-- Idioma -->
    <div class="form-group">
      <label for="idioma">Idioma preferido</label>
      <select id="idioma">
        <option value="es">Español</option>
        <option value="en">Inglés</option>
      </select>
    </div>

    <!-- Fecha nacimiento -->
    <div class="form-group">
      <label for="nacimiento">Fecha de nacimiento</label>
      <input type="date" id="nacimiento" />
    </div>

    <!-- Botón -->
    <button class="btn-a" type="submit" id="guardarDatos">
      Guardar cambios
    </button>

    <p id="datosMsg" class="form-msg"></p>

  </form>
</section>


<!-- ====== ESTILOS ====== -->
<style>
  .module-section {
    padding: 10px 5px 40px;
  }

  .module-title {
    font-family: Montserrat, sans-serif;
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 5px;
  }

  .module-subtitle {
    opacity: 0.7;
    margin-bottom: 25px;
  }

  .module-form {
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .form-group label {
    display: block;
    font-size: 14px;
    margin-bottom: 6px;
  }

  .form-group input,
  .form-group select {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: none;
    background: rgba(255,255,255,0.1);
    color: #fff;
    font-size: 15px;
  }

  .form-group input:disabled {
    opacity: 0.5;
  }

  .helper-text {
    opacity: 0.5;
    font-size: 12px;
  }

  .form-msg {
    margin-top: 10px;
    font-size: 14px;
  }
</style>


<!-- ====== JS (Opcional) ====== -->
<script type="module">
  import { supabase } from "/js/supabase.js";

  document.addEventListener("DOMContentLoaded", async () => {

    // Obtener usuario
    const { data: session } = await supabase.auth.getUser();
    if (!session?.user) return;

    const user = session.user;

    // Rellenar campos
    document.getElementById("nombre").value =
      user.user_metadata?.full_name || "";

    document.getElementById("email").value = user.email;

    document.getElementById("pais").value =
      user.user_metadata?.pais || "";

    document.getElementById("idioma").value =
      user.user_metadata?.idioma || "es";

    document.getElementById("nacimiento").value =
      user.user_metadata?.nacimiento || "";

    // Guardar cambios
    document.getElementById("form-datos").onsubmit = async (e) => {
      e.preventDefault();

      const msg = document.getElementById("datosMsg");
      msg.textContent = "Guardando...";

      const updates = {
        full_name: document.getElementById("nombre").value,
        pais: document.getElementById("pais").value,
        idioma: document.getElementById("idioma").value,
        nacimiento: document.getElementById("nacimiento").value
      };

      const { error } = await supabase.auth.updateUser({
        data: updates
      });

      msg.style.color = error ? "#ff6b6b" : "#3ee98a";
      msg.textContent = error ? "Error guardando" : "Guardado con éxito ✔";
    };
  });
</script>
