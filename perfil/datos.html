<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Advance+ · TITULO</title>

  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css"> <!-- reutilizamos estilo -->
</head>

<body class="app-bg">

  <!-- HEADER PREMIUM -->
  
  <!-- HEADER NUEVO (PREMIUM) -->
<header class="ap-header">
  <div class="ap-header-left">
    <h1 class="ap-logo">A+</h1>

    <div class="ap-header-info">
      <span id="headerUserName" class="ap-header-name">Usuario</span>
      <span id="headerUserRole" class="ap-header-role">Cargando…</span>
    </div>
  </div>

  <link rel="stylesheet" href="https://unpkg.com/cropperjs@1.6.1/dist/cropper.min.css">
  <script src="https://unpkg.com/cropperjs@1.6.1/dist/cropper.min.js"></script>

  <!-- Avatar dinámico (imagen o iniciales) -->
  <div id="headerAvatar" class="ap-header-avatar"></div>

  <button id="btnLogout" class="ap-logout-btn">Cerrar sesión</button>
</header>



  <!-- CONTENIDO PRINCIPAL -->
  <main class="dashboard-wrapper">
    <!-- Aquí va el contenido personalizado -->
<section class="dash-section">
  <h2 class="section-title">Mi perfil</h2>

  <div class="profile-card">

    <!-- 🖼 AVATAR -->
    <h3 class="section-sub">Foto de perfil</h3>

    <div class="avatar-box">
    <img id="avatarPreview" class="avatar-preview" alt="Avatar">

    <div class="avatar-actions">
        <label class="btn-avatar">
        Subir imagen
        <input type="file" id="avatarInput" accept="image/*" hidden>
        </label>

        <button id="avatarDelete" class="btn-avatar-delete">Eliminar</button>
    </div>
    </div>

    <!-- Modal recorte avatar -->
    <div id="avatarModal" class="avatar-modal hidden">
    <div class="avatar-modal-content">
        <h4>Recorta tu foto</h4>
        <div class="avatar-crop-container">
        <img id="avatarCropImage" src="" alt="Recorte avatar">
        </div>
        <div class="avatar-modal-actions">
        <button id="avatarCropCancel" type="button" class="btn-avatar-delete">Cancelar</button>
        <button id="avatarCropApply" type="button" class="btn-avatar">Aplicar recorte</button>
        </div>
    </div>
    </div>


    <!-- 🧍 DATOS PERSONALES -->
    <h3 class="section-sub">Datos personales</h3>

    <label>Nombre completo</label>
    <input id="input_fullname" class="profile-input" placeholder="Tu nombre..." />

    <label>Fecha de nacimiento</label>
    <input id="input_birthdate" type="date" class="profile-input" />

    <label>Género</label>
    <select id="input_gender" class="profile-input">
      <option value="">Prefiero no decir</option>
      <option value="male">Hombre</option>
      <option value="female">Mujer</option>
      <option value="other">Otro</option>
    </select>

    <label>Teléfono</label>
    <input id="input_phone" class="profile-input" placeholder="+41..." />

    <!-- País -->
    <label>País</label>
    <select id="input_country" class="profile-input">
      <option value="">Selecciona tu país</option>
      <option value="Chile">Chile</option>
      <option value="Suiza">Suiza</option>
      <option value="España">España</option>
      <option value="México">México</option>
      <option value="Argentina">Argentina</option>
      <option value="Colombia">Colombia</option>
      <option value="Perú">Perú</option>
      <option value="USA">USA</option>
      <option value="otro">Otro</option>
    </select>

    <!-- 🧠 PREFERENCIAS -->
    <h3 class="section-sub">Preferencias de la app</h3>

    <label>Idioma</label>
    <select id="input_language" class="profile-input">
      <option value="es">Español</option>
      <option value="en">Inglés</option>
    </select>

    <label>Zona horaria</label>
    <input id="input_timezone" class="profile-input" placeholder="Europe/Zurich" />

    <label>Focus Time preferido</label>
    <select id="input_focus" class="profile-input">
      <option value="">Selecciona</option>
      <option value="mañana">Mañana</option>
      <option value="tarde">Tarde</option>
      <option value="noche">Noche</option>
    </select>

    <!-- 🔔 NOTIFICACIONES -->
    <h3 class="section-sub">Notificaciones</h3>

    <div class="switch-row">
      <label>Notificar racha</label>
      <input type="checkbox" id="notif_racha" class="switch">
    </div>

    <div class="switch-row">
      <label>Privacidad de nombre</label>
      <input type="checkbox" id="notif_privNombre" class="switch">
    </div>

    <div class="switch-row">
      <label>Tema visual automático</label>
      <input type="checkbox" id="notif_tema" class="switch">
    </div>

    <!-- 🎯 OBJETIVOS -->
    <h3 class="section-sub">Objetivos</h3>

    <div class="switch-row">
      <label>Mejorar disciplina</label>
      <input type="checkbox" id="goal_disciplina" class="switch">
    </div>

    <div class="switch-row">
      <label>Mejorar foco</label>
      <input type="checkbox" id="goal_foco" class="switch">
    </div>

    <div class="switch-row">
      <label>Mejorar energía</label>
      <input type="checkbox" id="goal_energia" class="switch">
    </div>

    <!-- 📨 INFO CUENTA -->
    <h3 class="section-sub">Información de tu cuenta</h3>

    <div class="account-info-box">
      <p class="label-small">Email</p>
      <p id="p_email" class="profile-static"></p>

      <p class="label-small" style="margin-top:10px;">Miembro desde</p>
      <p id="p_created" class="profile-static"></p>
    </div>

    <!-- 💾 BOTÓN -->
    <button id="saveProfileBtn" class="btn-save-profile">Guardar cambios</button>
    <p id="saveMessage" class="save-message"></p>

  </div>
</section>


  </main>

  <!-- TAB BAR MÓVIL -->
  <nav class="tabbar">
    <button class="tab-btn" data-nav="dashboard">
      <span>🏠</span><small>Inicio</small>
    </button>

    <button class="tab-btn" data-nav="courses">
      <span>📘</span><small>Retos</small>
    </button>

    <button class="tab-btn" data-nav="profile">
      <span>👤</span><small>Perfil</small>
    </button>

    <button class="tab-btn" data-nav="stats">
      <span>📊</span><small>Progreso</small>
    </button>
  </nav>

  <!-- ROUTER -->
  <script type="module">
    import { protectUserView } from "/js/router.js";
    protectUserView();
  </script>

  <!-- JS ESPECÍFICO -->
  <script type="module" src="/perfil/perfil.js"></script>

  <script type="module">
    import { loadUserHeader } from "/components/user-header.js";
    loadUserHeader();
  </script>

</body>
</html>
