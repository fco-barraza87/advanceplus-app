<section class="module-section">

  <h2 class="module-title">Imagen de perfil</h2>
  <p class="module-subtitle">
    Personaliza tu avatar para que tu experiencia en Advance+ sea más personal.
  </p>

  <!-- VISTA PREVIA -->
  <div class="avatar-card">
    <div id="avatarPreview" class="avatar-preview">
      <!-- Foto o iniciales se cargan por JS -->
    </div>

    <p class="avatar-hint">Formatos permitidos: JPG, PNG · Máx 2MB</p>

    <!-- BOTONES -->
    <div class="avatar-actions">
      <label class="btn-a avatar-upload-btn">
        Subir nueva foto
        <input 
          id="avatarInput" 
          type="file" 
          accept="image/*"
          capture="user"
          hidden>
      </label>

      <button id="avatarDelete" class="btn-b" type="button">Eliminar foto</button>
    </div>

    <p id="avatarMsg" class="form-msg" style="margin-top:10px;"></p>
  </div>

</section>

<style>
  .avatar-card {
    background: rgba(255,255,255,0.03);
    border-radius: 16px;
    padding: 20px;
    text-align: center;
    border: 1px solid rgba(192,164,80,0.2);
    box-shadow: 0 10px 30px rgba(0,0,0,0.45);
    max-width: 360px;
    margin: auto;
  }

  .avatar-preview {
    width: 130px;
    height: 130px;
    margin: 0 auto 14px;
    border-radius: 999px;
    background: radial-gradient(circle at 30% 20%, #C0A450, #0F1E44);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 44px;
    color: white;
    font-weight: 700;
    overflow: hidden;
    border: 3px solid rgba(192,164,80,0.4);
  }

  .avatar-preview img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .avatar-actions {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 14px;
  }

  .avatar-upload-btn {
    display: block;
    cursor: pointer;
  }

  .avatar-hint {
    opacity: 0.7;
    font-size: 13px;
    margin-bottom: 10px;
  }
</style>

<script type="module" src="/perfil/js/perfil-avatar.js"></script>
