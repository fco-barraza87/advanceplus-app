<section class="module-section">

  <h2 class="module-title">Tu Avatar</h2>
  <p class="module-subtitle">
    Personaliza tu imagen de perfil para que tu experiencia en Advance+ sea más personal.
  </p>

  <div class="avatar-card">

    <!-- PREVIEW -->
    <div class="avatar-preview-wrapper">
      <img id="avatarPreview" class="avatar-image hidden" />
      <div id="avatarInitials" class="initials-avatar hidden"></div>
    </div>


    <!-- ACCIONES -->
    <div class="avatar-actions">

      <input id="avatarInput" type="file" accept="image/*" class="hidden" />

      <button id="avatarUploadBtn" class="btn-a" type="button">
        Subir nueva foto
      </button>

      <button id="avatarDeleteBtn" class="btn-b" type="button">
        Quitar avatar
      </button>

      <p id="avatarMsg" class="avatar-status"></p>

    </div>
  </div>

</section>


<style>
  .avatar-card {
    background: rgba(10, 15, 35, 0.9);
    padding: 24px;
    border-radius: 20px;
    border: 1px solid rgba(192,164,80,0.15);
    display: flex;
    flex-direction: column;
    gap: 20px;
    align-items: center;
    max-width: 420px;
  }

  .avatar-preview-wrapper {
    width: 160px;
    height: 160px;
    border-radius: 999px;
    overflow: hidden;
    border: 3px solid var(--ap-gold);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .avatar-preview {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
  }

  .avatar-initials {
    position: absolute;
    font-size: 42px;
    font-weight: 700;
    color: var(--ap-gold);
  }

  .avatar-actions {
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: 100%;
  }

  #avatarUploadBtn,
  #avatarDeleteBtn {
    width: 100%;
  }

  .avatar-status {
    text-align: center;
    height: 20px;
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const uploadBtn = document.getElementById("avatarUploadBtn");
    const input = document.getElementById("avatarInput");
    uploadBtn.onclick = () => input.click();
  });
</script>
