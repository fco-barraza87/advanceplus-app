<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Advance+ · TITULO</title>

  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css"> <!-- reutilizamos estilo -->
</head>

<body class="app-bg">

  <!-- HEADER PREMIUM -->
  
  <!-- HEADER NUEVO (PREMIUM) -->
<header class="ap-header">
  <div class="ap-header-left">
    <h1 class="ap-logo">A+</h1>

    <div class="ap-header-info">
      <span id="headerUserName" class="ap-header-name">Usuario</span>
      <span id="headerUserRole" class="ap-header-role">Cargando…</span>
    </div>
  </div>

    <!-- MIS RETOS ACTIVOS -->
    <section class="dash-section">
      <h2 class="section-title">Tus retos activos</h2>

      <div id="activeCoursesGrid" class="courses-grid"></div>

      <p id="noActiveCourses" class="empty-message" style="display:none;">
        No tienes retos activos actualmente.
      </p>
    </section>

    <!-- TODOS LOS RETOS -->
    <section class="dash-section">
      <h2 class="section-title">Todos los retos</h2>

      <div id="allCoursesGrid" class="courses-grid"></div>

      <p id="noCoursesMessage" class="empty-message" style="display:none;">
        No hay retos disponibles en este momento.
      </p>
    </section>


  </main>

  <!-- TAB BAR MÓVIL -->
  <nav class="tabbar">
    <button class="tab-btn" data-nav="dashboard">
      <span>🏠</span><small>Inicio</small>
    </button>

    <button class="tab-btn" data-nav="courses">
      <span>📘</span><small>Retos</small>
    </button>

    <button class="tab-btn" data-nav="profile">
      <span>👤</span><small>Perfil</small>
    </button>

    <button class="tab-btn" data-nav="stats">
      <span>📊</span><small>Progreso</small>
    </button>
  </nav>

  <!-- ROUTER -->
  <script type="module">
    import { protectUserView } from "/js/router.js";
    protectUserView();
  </script>

  <!-- JS ESPECÍFICO -->
  <script type="module" src="/perfil/retos.js"></script>

  <script type="module">
    import { loadUserHeader } from "/components/user-header.js";
    loadUserHeader();
  </script>

</body>
</html>
