<section class="module-section">

  <h2 class="module-title">Mis cursos</h2>
  <p class="module-subtitle">
    Retoma donde lo dejaste y sigue avanzando en tus programas Advance+.
  </p>

  <!-- RESUMEN -->
  <div id="coursesSummary" class="courses-summary-card">
    <div class="courses-summary-item">
      <span class="label">Cursos activos</span>
      <span class="value" id="coursesActiveCount">-</span>
    </div>
    <div class="courses-summary-item">
      <span class="label">Completados</span>
      <span class="value" id="coursesCompletedCount">-</span>
    </div>
    <div class="courses-summary-item">
      <span class="label">XP total</span>
      <span class="value" id="coursesXpTotal">-</span>
    </div>
  </div>

  <!-- LISTA -->
  <div id="coursesContainer" class="courses-grid">
    <!-- JS rellena los cursos aquí -->
  </div>

  <!-- MENSAJE VACÍO -->
  <p id="coursesEmpty" class="empty-message" style="display:none;">
    Aún no estás inscrito en ningún curso. Pronto verás aquí tus programas activos.
  </p>

</section>
